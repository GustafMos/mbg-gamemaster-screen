<div id="app">
  <div class="app-fog" aria-hidden="true"></div>

  <header class="topbar">
    <button class="icon-btn nav-toggle" id="navToggle" title="Toggle navigation" aria-label="Toggle navigation"><svg><use href="#i-menu"/></svg></button>
    <a class="brand" href="#" data-go="dashboard" title="MBG's GameMaster Screen">
      <span class="brand-glyph">R</span>
      <span class="brand-text"><strong>MBG'S</strong><small>GAMEMASTER SCREEN</small></span>
    </a>
    <button class="campaign-btn" id="campaignBtn" title="Rename campaign">
      <svg class="campaign-icon"><use href="#i-castle"/></svg>
      <span id="campaignName">My Campaign</span>
      <svg class="tiny"><use href="#i-edit"/></svg>
    </button>
    <div class="top-spacer"></div>
    <button class="search-launch" id="searchLaunch">
      <svg><use href="#i-search"/></svg>
      <span>Search monsters, items, rules, areas…</span>
      <kbd>Ctrl K</kbd>
    </button>
    <div class="session-timer" id="sessionTimer" title="Session timer — click to toggle">
      <svg><use href="#i-clock"/></svg>
      <span id="timerDisplay">0:00:00</span>
      <button class="timer-btn" id="timerToggle" aria-label="Pause session timer"><svg><use href="#i-pause"/></svg></button>
      <button class="timer-btn" id="timerReset" aria-label="Reset session timer"><svg><use href="#i-reset"/></svg></button>
    </div>
    <button class="icon-btn" id="diceBtn" title="Dice roller" aria-label="Dice roller"><svg><use href="#i-dice"/></svg></button>
    <button class="icon-btn" id="helpBtn" title="Keyboard shortcuts" aria-label="Help"><span class="help-q">?</span></button>
  </header>

  <aside class="sidebar" id="sidebar">
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="sidebar-foot">
      <button class="sidebar-action" id="quickDice" title="Quick roll"><svg><use href="#i-dice"/></svg><span>Roll dice</span></button>
      <div class="save-state" id="saveState"><i></i><span>Saved</span></div>
    </div>
  </aside>

  <main id="main" tabindex="-1"></main>

  <section class="dock" id="dock" data-drop="initiative" aria-label="Initiative tracker">
    <div class="dock-head">
      <button class="dock-title" id="dockExpand" title="Open initiative tracker">
        <svg><use href="#i-swords"/></svg>
        <span>Initiative</span>
        <em id="dockRound">—</em>
      </button>
      <div class="dock-controls">
        <button class="dock-btn" id="dockPrev" title="Previous turn"><svg style="transform:rotate(180deg)"><use href="#i-chevron"/></svg></button>
        <button class="dock-btn next" id="dockNext" title="Next turn">Next <svg><use href="#i-chevron"/></svg></button>
      </div>
    </div>
    <div class="dock-track" id="dockTrack">
      <div class="dock-empty">Drag a monster or party member here to roll initiative. <button class="link-btn" id="dockOpen">Open tracker</button></div>
    </div>
    <div class="dock-drop-hint" aria-hidden="true">Drop to add to initiative</div>
  </section>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-title" id="drawerTitle"></div>
      <div class="drawer-tools" id="drawerTools"></div>
      <button class="icon-btn" id="drawerClose" aria-label="Close panel"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
  <div class="scrim" id="scrim"></div>

  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette-box">
      <div class="palette-input">
        <svg><use href="#i-search"/></svg>
        <input id="paletteInput" placeholder="Search everything — spells, items, monsters, areas, actions…" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <div class="palette-filters" id="paletteFilters"></div>
      <div class="palette-results" id="paletteResults"></div>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>Enter</kbd> open</span>
        <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> add to initiative</span>
        <span class="palette-hint" id="paletteHint"></span>
      </div>
    </div>
  </div>

  <div class="modal-wrap" id="modalWrap" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="dice-pop" id="dicePop" aria-hidden="true">
    <div class="dice-head"><span>Dice</span><button class="icon-btn sm" id="diceClose"><svg><use href="#i-close"/></svg></button></div>
    <div class="dice-grid" id="diceGrid"></div>
    <div class="dice-custom">
      <input id="diceExpr" placeholder="2d6+3" spellcheck="false">
      <button class="btn btn-primary sm" id="diceRoll">Roll</button>
    </div>
    <div class="dice-adv">
      <button class="chip" data-adv="0">Normal</button>
      <button class="chip" data-adv="1">Advantage</button>
      <button class="chip" data-adv="-1">Disadvantage</button>
    </div>
    <div class="dice-log" id="diceLog"></div>
  </div>
</div>
